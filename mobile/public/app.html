<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Universal Asset Owners</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --navy2: #12263f;
      --gold: #c9a24b;
      --gold2: #e6c75a;
      --line: #1d2e44;
      --cream: #f4efe6;
      --text: #f5f1e6;
      --muted: #8a9bb0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(120% 80% at 50% 0%, #16314a 0%, #0b1f3a 55%, #071422 100%);
      color: var(--text);
    }
    .phone {
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    @media (min-width: 640px) {
      body { padding: 24px 0; }
      .phone { height: min(900px, calc(100vh - 48px)); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; }
    }
    header { padding: 18px 18px 8px; }
    .kicker { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 0; }
    .lede { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 8px 0 0; }
    nav.tabs {
      display: flex;
      border-top: 1px solid var(--line);
      background: #0a1626;
    }
    nav.tabs button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--muted);
      padding: 12px 4px 14px;
      font: 700 10px/1.2 system-ui, sans-serif;
      letter-spacing: .4px;
      cursor: pointer;
    }
    nav.tabs button.on { color: var(--gold); }
    main { flex: 1; overflow: auto; padding: 0 18px 24px; }
    .card {
      background: var(--navy2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      cursor: pointer;
    }
    .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #0a1626; }
    .card h2 { font-size: 19px; line-height: 1.25; margin: 6px 0; }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0; }
    .meta { color: #d8d0c0; font-size: 12px; margin-top: 8px; font-family: system-ui, sans-serif; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chips button, .ghost {
      border: 1px solid var(--line);
      background: #16314a;
      color: var(--cream);
      border-radius: 20px;
      padding: 7px 12px;
      font: 600 13px system-ui, sans-serif;
      cursor: pointer;
    }
    .subscribe {
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
    }
    .subscribe input, .subscribe button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font: 15px system-ui, sans-serif;
    }
    .subscribe input { background: #0a1626; color: var(--text); }
    .subscribe button { background: var(--gold); color: var(--navy); font-weight: 800; cursor: pointer; }
    article.reader { display: none; flex-direction: column; height: 100%; }
    article.reader.show { display: flex; }
    .app.show-reader main, .app.show-reader nav.tabs, .app.show-reader header { display: none; }
    .app.show-reader article.reader { display: flex; }
    .reader-top { background: var(--navy); padding: 12px 16px 16px; }
    .reader-top button { background: none; border: 0; color: var(--gold2); font: 600 14px system-ui; cursor: pointer; padding: 0 0 8px; }
    iframe.body { flex: 1; width: 100%; border: 0; background: var(--cream); }
    .empty { color: var(--muted); padding: 28px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="phone app" id="app">
    <header>
      <div class="kicker">Universal Asset Owners</div>
      <h1 id="title">Capital at the scale of the world.</h1>
      <p class="lede" id="lede">The same daily brief, Probability Desk, research, charts, video and podcasts as the website.</p>
    </header>
    <main id="main"><div class="empty">Loading today’s intelligence…</div></main>
    <nav class="tabs">
      <button class="on" data-tab="today">TODAY</button>
      <button data-tab="brief">BRIEF</button>
      <button data-tab="desk">DESK</button>
      <button data-tab="research">NOTE</button>
      <button data-tab="more">MORE</button>
    </nav>
    <article class="reader" id="reader">
      <div class="reader-top">
        <button type="button" id="back">‹ Back</button>
        <div class="kicker" id="rkicker"></div>
        <h1 id="rtitle"></h1>
        <div class="meta" id="rmeta"></div>
      </div>
      <iframe class="body" id="rbody" title="Briefing"></iframe>
    </article>
  </div>
  <script>
    const API = 'https://universal-asset-owners.ghost.io/ghost/api/content';
    const KEY = '4cb0118527b7b2a473e665856a';
    const FILTERS = {
      today: '',
      brief: 'tag:hash-daily-brief',
      desk: 'tag:hash-probability-desk',
      research: 'tag:hash-research',
      charts: 'tag:hash-chart',
      watch: 'tag:hash-video-briefing',
      listen: 'tag:hash-podcast',
    };
    const COPY = {
      today: ['Today’s intelligence', 'For investors who own the whole market, the largest risks cannot be diversified away.'],
      brief: ['The Universal Owner', 'The morning long-form that ships every weekday on the website.'],
      desk: ['The Probability Desk', 'Base cases, tail risks and second-order effects — for capital that thinks in decades.'],
      research: ['UAO Research', 'The same research library as universalassetowners.com.'],
      more: ['More from the desk', 'Watch, listen, charts, and the same subscribe path as the website.'],
    };
    const cache = {};
    let tab = 'today';

    const $ = (id) => document.getElementById(id);
    function fmt(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'America/New_York' });
    }
    function kicker(post) {
      const slugs = (post.tags || []).map((t) => t.slug);
      if (slugs.some((s) => s.includes('probability'))) return 'The Probability Desk';
      if (slugs.some((s) => s.includes('research'))) return 'UAO Research';
      if (slugs.some((s) => s.includes('chart'))) return 'Chart of the Day';
      if (slugs.some((s) => s.includes('video'))) return 'Watch';
      if (slugs.some((s) => s.includes('podcast'))) return 'Listen';
      return 'The Universal Owner';
    }
    async function fetchPosts(filter, limit = 12) {
      const key = filter + ':' + limit;
      if (cache[key]) return cache[key];
      const url = new URL(API + '/posts/');
      url.searchParams.set('key', KEY);
      url.searchParams.set('limit', String(limit));
      url.searchParams.set('include', 'tags,authors');
      url.searchParams.set('order', 'published_at DESC');
      if (filter) url.searchParams.set('filter', filter);
      const res = await fetch(url);
      if (!res.ok) throw new Error('Could not reach the UAO desk (' + res.status + ')');
      const data = await res.json();
      cache[key] = data.posts || [];
      return cache[key];
    }
    async function fetchPost(slug) {
      const url = new URL(API + '/posts/slug/' + encodeURIComponent(slug) + '/');
      url.searchParams.set('key', KEY);
      url.searchParams.set('include', 'tags,authors');
      const res = await fetch(url);
      const data = await res.json();
      return data.posts[0];
    }
    function card(post) {
      const excerpt = post.custom_excerpt || post.excerpt || '';
      const img = post.feature_image ? `<img src="${post.feature_image}" alt="">` : '';
      return `<article class="card" data-slug="${post.slug}">
        ${img}
        <div class="kicker">${kicker(post)}</div>
        <h2>${post.title}</h2>
        <p>${excerpt}</p>
        <div class="meta">${fmt(post.published_at)}${post.reading_time ? ' · ' + post.reading_time + ' min read' : ''}</div>
      </article>`;
    }
    function subscribe() {
      return `<div class="subscribe">
        <div class="kicker">The Daily Brief</div>
        <h2>Get tomorrow’s brief in your inbox — and in this app.</h2>
        <p class="lede">Complimentary. Each subscriber is reviewed by the editorial desk.</p>
        <input id="email" type="email" placeholder="you@institution.com" />
        <button type="button" id="signup">Get the daily brief</button>
      </div>`;
    }
    async function render(next) {
      tab = next;
      document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
      $('title').textContent = COPY[tab][0];
      $('lede').textContent = COPY[tab][1];
      $('main').innerHTML = '<div class="empty">Loading today’s intelligence…</div>';
      try {
        if (tab === 'more') {
          $('main').innerHTML = `
            <div class="chips">
              <button data-tab="watch">Watch</button>
              <button data-tab="listen">Listen</button>
              <button data-tab="charts">Chart</button>
            </div>
            <p class="lede">Two daily shows. Four formats. The same news as universalassetowners.com.</p>
            ${subscribe()}`;
          $('main').querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
            COPY[b.dataset.tab] = [b.textContent, 'The same format stream as the website.'];
            render(b.dataset.tab);
          });
          $('signup').onclick = () => {
            const email = $('email').value.trim();
            location.href = 'https://www.universalassetowners.com/#/portal/signup' + (email ? '?email=' + encodeURIComponent(email) : '');
          };
          return;
        }
        if (tab === 'today') {
          const [briefs, desk, charts] = await Promise.all([
            fetchPosts(FILTERS.brief, 1),
            fetchPosts(FILTERS.desk, 3),
            fetchPosts(FILTERS.charts, 3),
          ]);
          $('main').innerHTML = `
            <div class="chips">
              <button data-tab="brief">Read</button>
              <button data-tab="watch">Watch</button>
              <button data-tab="listen">Listen</button>
              <button data-tab="charts">Chart</button>
            </div>
            <div class="kicker">Today’s intelligence</div>
            ${briefs.map(card).join('')}
            <div class="kicker" style="margin-top:18px">The Probability Desk</div>
            ${desk.map(card).join('')}
            <div class="kicker" style="margin-top:18px">Chart of the Day</div>
            ${charts.map(card).join('')}
            ${subscribe()}`;
          $('main').querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
            COPY[b.dataset.tab] = COPY[b.dataset.tab] || [b.textContent, 'The same format stream as the website.'];
            render(b.dataset.tab);
          });
          $('signup').onclick = () => {
            const email = $('email').value.trim();
            location.href = 'https://www.universalassetowners.com/#/portal/signup' + (email ? '?email=' + encodeURIComponent(email) : '');
          };
        } else {
          const posts = await fetchPosts(FILTERS[tab] || '', 15);
          $('main').innerHTML = posts.length ? posts.map(card).join('') : '<div class="empty">Nothing from this desk yet.</div>';
        }
        $('main').querySelectorAll('.card').forEach((el) => el.onclick = () => openPost(el.dataset.slug));
      } catch (err) {
        $('main').innerHTML = `<div class="empty">${err.message}</div>`;
      }
    }
    async function openPost(slug) {
      const post = await fetchPost(slug);
      $('rkicker').textContent = kicker(post);
      $('rtitle').textContent = post.title;
      $('rmeta').textContent = (post.authors?.[0]?.name || 'UAO Editorial') + ' · ' + fmt(post.published_at);
      $('rbody').srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <style>body{margin:0;padding:16px 18px 40px;background:#f4efe6;color:#12202f;font:17px/1.65 Georgia,serif}h1,h2{color:#0b1f3a}h2{border-bottom:2px solid #c9a24b;padding-bottom:8px}a{color:#8a7433}img,iframe{max-width:100%}iframe{width:100%;min-height:220px;border:0}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#0b1f3a;color:#f4efe6;padding:8px;text-align:left}td{padding:8px;border-bottom:1px solid #e3ddce}</style></head>
        <body>${post.html || post.excerpt || ''}</body></html>`;
      document.getElementById('app').classList.add('show-reader');
    }
    $('back').onclick = () => document.getElementById('app').classList.remove('show-reader');
    document.querySelectorAll('nav.tabs button').forEach((b) => b.onclick = () => render(b.dataset.tab));
    render('today');
  </script>
</body>
</html>
