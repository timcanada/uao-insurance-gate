name: growth-agent
on:
  push:
    paths:
      - "growth-agent/**"
      - ".github/workflows/growth-agent.yml"
  pull_request:
    paths:
      - "growth-agent/**"
      - ".github/workflows/growth-agent.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: growth-agent
        env:
          PYTHONPATH: src
